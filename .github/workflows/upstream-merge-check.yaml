name: Upstream / Merge check

# Weekly dry-run: can upstream jellyfin-androidtv merge into release-custom-home and
# still build? Reports the answer in the run summary. NEVER pushes anything — a clean
# result just means a manual merge session is cheap right now.

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-check:
    name: Dry-run upstream merge
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          ref: release-custom-home
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/jellyfin/jellyfin-androidtv.git
          git fetch upstream master --tags
          # The merge target is the newest STABLE tag (vX.Y.Z), not the moving dev branch.
          TAG=$(git tag --list 'v*' --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "TARGET_TAG=$TAG" >> "$GITHUB_ENV"
          echo "BEHIND_MASTER=$(git rev-list --count HEAD..upstream/master)" >> "$GITHUB_ENV"
          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "UP_TO_DATE=yes" >> "$GITHUB_ENV"
          else
            echo "UP_TO_DATE=no" >> "$GITHUB_ENV"
          fi

      - name: Attempt merge (no commit, never pushed)
        id: merge
        if: env.UP_TO_DATE == 'no'
        run: |
          git config user.email "ci@local" && git config user.name "merge-check"
          if git merge --no-edit "$TARGET_TAG"; then
            echo "merged=clean" >> "$GITHUB_OUTPUT"
          else
            echo "merged=conflict" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
          fi

      - name: Setup Java
        if: steps.merge.outputs.merged == 'clean'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        if: steps.merge.outputs.merged == 'clean'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build merged tree
        if: steps.merge.outputs.merged == 'clean'
        id: build
        run: |
          if ./gradlew :app:assembleDebug; then
            echo "build=success" >> "$GITHUB_OUTPUT"
          else
            echo "build=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Report
        if: always()
        run: |
          {
            echo "## Upstream merge check"
            echo ""
            echo "Latest stable tag: **${TARGET_TAG:-?}** · dev branch is ${BEHIND_MASTER:-?} commits ahead (informational)."
            if [ "${UP_TO_DATE}" = "yes" ]; then
              echo "✅ Already up to date with the latest stable release — nothing to merge."
            elif [ "${{ steps.merge.outputs.merged }}" = "clean" ]; then
              if [ "${{ steps.build.outputs.build }}" = "success" ]; then
                echo "🆕 ${TARGET_TAG} merges cleanly AND builds. A merge session is cheap right now."
              else
                echo "⚠️ ${TARGET_TAG} merges cleanly but the BUILD FAILS — upstream changed an API our code uses. Needs a hands-on session."
              fi
            else
              echo "❌ ${TARGET_TAG} has merge conflicts in:"
              echo '```'
              cat /tmp/conflicts.txt 2>/dev/null || echo "(unknown)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
